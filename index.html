<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KAASH IV – ICU Drug Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
}

.container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  background: #0056b3;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

#warning {
  margin-top: 15px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">
  <h2>ICU IV Drug Calculator</h2>

  <label>Drug</label>
  <select id="drug"></select>

  <label>Patient Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 70">

  <label>Prescribed Dose</label>
  <input type="number" id="dose" placeholder="mcg/kg/min or mg/min">

  <button onclick="calculate()">Calculate</button>

  <div id="warning"></div>
  <div id="result"></div>
</div>

<script>
const drugs = [
  { name: "Norepinephrine", highAlert: true, concentration: 8, unit: "mcg/kg/min" },
  { name: "Dopamine", highAlert: true, concentration: 1600, unit: "mcg/kg/min" },
  { name: "Dobutamine", highAlert: true, concentration: 500, unit: "mcg/kg/min" },
  { name: "Nitroglycerin", highAlert: true, concentration: 200, unit: "mcg/min" },
  { name: "Amiodarone", highAlert: true, concentration: 1.8, unit: "mg/min" }
];

const drugSelect = document.getElementById("drug");

drugs.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d.name;
  opt.text = d.name;
  drugSelect.appendChild(opt);
});

function calculate() {
  const drug = drugs.find(d => d.name === drugSelect.value);
  const weight = parseFloat(document.getElementById("weight").value);
  const dose = parseFloat(document.getElementById("dose").value);

  if (isNaN(dose) || (drug.unit === "mcg/kg/min" && isNaN(weight))) {
    alert("Please enter valid numbers");
    return;
  }

  let dosePerMin = drug.unit === "mcg/kg/min" ? dose * weight : dose;
  let dosePerHour = dosePerMin * 60;
  let mlPerHour = dosePerHour / drug.concentration;

  document.getElementById("result").innerHTML =
    `Dose per minute: ${dosePerMin.toFixed(2)} mcg<br>
     Dose per hour: ${dosePerHour.toFixed(2)} mcg<br>
     <b>Pump Rate: ${mlPerHour.toFixed(2)} mL/hr</b>`;

  if (drug.highAlert) {
    document.getElementById("warning").innerHTML =
      "🔴 HIGH ALERT MEDICATION – Double check required!";
    document.getElementById("warning").style.color = "red";
  }
}
</script>

</body>
</html>
