            else if (d.ty === "unitsmin") val = (dose * 60 * d.ml) / d.mg;
            else if (d.ty === "mcgkghr") val = (dose * w * d.ml) / (d.mg);
            res.style.display = "block"; res.innerHTML = `SET PUMP TO: ${val.toFixed(1)} ml/hr`;

            c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none";

    }
