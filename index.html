<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KAASH IV – ICU Drug Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
}

.container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  background: #0056b3;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

#warning {
  margin-top: 15px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">
  <h2>ICU IV Drug Calculator</h2>

  <label>Drug</label>
  <select id="drug"></select>

  <label>Patient Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 70">

  <label>Prescribed Dose</label>
  <input type="number" id="dose" placeholder="mcg/kg/min or mg/min">

  <button onclick="calculate()">Calculate</button>

  <div id="warning"></div>
  <div id="result"></div>
</div>

<script>
/* ===================== DRUG DATABASE (PHASE 1 – ICU & HIGH ALERT) ===================== */

const drugs = [

  /* ===== VASOPRESSORS (WEIGHT BASED) ===== */
  {
    name: "Norepinephrine",
    category: "Vasopressor",
    highAlert: true,
    calcType: "WEIGHT_CONTINUOUS",
    unit: "mcg/kg/min",
    concentration: 8,          // mcg/mL (4 mg / 500 mL)
    diluent: ["NS", "D5W"]
  },
  {
    name: "Dopamine",
    category: "Vasopressor",
    highAlert: true,
    calcType: "WEIGHT_CONTINUOUS",
    unit: "mcg/kg/min",
    concentration: 1600,       // mcg/mL (400 mg / 250 mL)
    diluent: ["NS", "D5W"]
  },
  {
    name: "Dobutamine",
    category: "Inotrope",
    highAlert: true,
    calcType: "WEIGHT_CONTINUOUS",
    unit: "mcg/kg/min",
    concentration: 500,        // mcg/mL (250 mg / 500 mL)
    diluent: ["NS", "D5W"]
  },

  /* ===== NON-WEIGHT CONTINUOUS ===== */
  {
    name: "Epinephrine",
    category: "Vasopressor",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "mcg/min",
    concentration: 4,          // mcg/mL (1 mg / 250 mL)
    diluent: ["D5W"]
  },
  {
    name: "Nitroglycerin",
    category: "Vasodilator",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "mcg/min",
    concentration: 200,        // mcg/mL (50 mg / 250 mL)
    diluent: ["NS", "D5W"]
  },
  {
    name: "Vasopressin",
    category: "Vasopressor",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "units/min",
    concentration: 0.1,
    diluent: ["NS", "D5W"]
  },

  /* ===== SEDATION / ANALGESIA ===== */
  {
    name: "Propofol",
    category: "Sedation",
    highAlert: true,
    calcType: "WEIGHT_CONTINUOUS",
    unit: "mcg/kg/min",
    concentration: 10,
    diluent: ["D5W"]
  },
  {
    name: "Midazolam",
    category: "Sedation",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "mg/hr",
    concentration: 1,
    diluent: ["NS", "D5W"]
  },
  {
    name: "Fentanyl",
    category: "Analgesic",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "mcg/hr",
    concentration: 50,
    diluent: ["NS", "D5W"]
  },

  /* ===== ELECTROLYTES ===== */
  {
    name: "Potassium Chloride",
    category: "Electrolyte",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "mEq/hr",
    concentration: 2,
    diluent: ["NS"]
  },
  {
    name: "Magnesium Sulfate",
    category: "Electrolyte",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "g/hr",
    concentration: 0.1,
    diluent: ["NS", "D5W"]
  },
  {
    name: "Calcium Gluconate",
    category: "Electrolyte",
    highAlert: true,
    calcType: "NON_WEIGHT_CONTINUOUS",
    unit: "g/hr",
    concentration: 0.1,
    diluent: ["NS", "D5W"]
  }

];

/* ===================== POPULATE DRUG LIST ===================== */

const drugSelect = document.getElementById("drug");
drugSelect.innerHTML = "";

drugs.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d.name;
  opt.text = d.name;
  drugSelect.appendChild(opt);
});

/* ===================== CALCULATION ENGINE ===================== */

function calculate() {

  const drug = drugs.find(d => d.name === drugSelect.value);
  const weight = parseFloat(document.getElementById("weight").value);
  const dose = parseFloat(document.getElementById("dose").value);

  if (!drug) return;

  if (isNaN(dose) || (drug.calcType === "WEIGHT_CONTINUOUS" && isNaN(weight))) {
    alert("Please enter valid numbers");
    return;
  }

  let mlPerHour = 0;
  let info = "";

  switch (drug.calcType) {

    case "WEIGHT_CONTINUOUS":
      const doseMin = dose * weight;
      const doseHour = doseMin * 60;
      mlPerHour = doseHour / drug.concentration;
      info = `Weight-based infusion<br>Diluent: ${drug.diluent.join(" / ")}`;
      break;

    case "NON_WEIGHT_CONTINUOUS":
      mlPerHour = (dose * 60) / drug.concentration;
      info = `Non-weight infusion<br>Diluent: ${drug.diluent.join(" / ")}`;
      break;
  }

  document.getElementById("result").innerHTML =
    `<b>Pump Rate:</b> ${mlPerHour.toFixed(2)} mL/hr<br>${info}`;

  if (drug.highAlert) {
    document.getElementById("warning").innerHTML =
      "🔴 HIGH-ALERT MEDICATION – Independent double check required";
    document.getElementById("warning").style.color = "red";
  } else {
    document.getElementById("warning").innerHTML = "";
  }
}
</script>


</body>
</html>
